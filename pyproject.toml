[project]
name = "delta-bench"
version = "0.1.0"
description = "Do models that predict tool outputs well also act well? Open models on Delta-World, scored on both."
readme = "README.md"
license = "Apache-2.0"
requires-python = "~=3.12.0"  # Delta-World's
dependencies = [
    "delta-world",
    "matplotlib>=3.9",
    "modal==1.6.3",  # Delta-World's pin
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv.sources]
# The simulator, the tasks and the evaluation harness, as a git submodule.
delta-world = { path = "third_party/delta_world", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # modal_app

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["third_party"]
